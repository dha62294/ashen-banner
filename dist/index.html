<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#172033" />
  <meta name="description" content="Ashen Banner is an original turn-based tactical RPG playable in your browser." />
  <title>Ashen Banner — Tactical RPG</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23172033'/%3E%3Cpath d='M18 9h28v42L32 57 18 51z' fill='%23e3b655'/%3E%3Cpath d='M24 17h16v25H24z' fill='%23b34648'/%3E%3C/svg%3E" />
  <style>
    :root { --ink:#edf2f1; --muted:#9fb0b6; --navy:#172033; --panel:#202d43; --rim:#39526a; --gold:#e3b655; --red:#d45757; --blue:#65b9dc; --green:#82b966; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 30% 0%,#314462 0,#172033 48%,#101722 100%); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; letter-spacing:.02em; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .shell { max-width:1180px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; gap:18px; align-items:end; border-bottom:3px solid var(--gold); padding-bottom:18px; }
    .eyebrow { color:var(--gold); font-size:.75rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:5px 0 0; font-size:clamp(1.65rem,5vw,3rem); line-height:1; letter-spacing:.06em; }
    .chapter { text-align:right; color:var(--muted); font-size:.8rem; line-height:1.6; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:22px; padding-top:22px; }
    .game, .sidebar { background:linear-gradient(145deg,rgba(43,61,87,.95),rgba(27,39,59,.95)); border:2px solid var(--rim); box-shadow:7px 7px 0 rgba(0,0,0,.18); }
    .game { padding:18px; min-width:0; }
    .topline { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:14px; font-size:.78rem; }
    #objective { color:var(--gold); }
    #turn { color:var(--blue); font-weight:bold; }
    #board { display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1; width:min(100%,680px); margin:auto; border:4px solid #0e1520; background:#0e1520; gap:2px; touch-action:manipulation; }
    .cell { position:relative; display:grid; place-items:center; border:0; min-width:0; padding:0; background:#4d8159; outline:1px solid rgba(0,0,0,.16); }
    .cell::after { content:attr(data-symbol); color:white; font-size:clamp(1rem,3.3vw,2rem); font-weight:900; text-shadow:2px 2px 0 rgba(0,0,0,.55); }
    .plain { background:#54895b; } .forest { background:#2f6546; } .road { background:#b9955a; } .water { background:#297aa3; } .wall { background:#677481; }
    .cell.friendly::before,.cell.enemy::before { content:""; position:absolute; inset:10%; border:3px solid; pointer-events:none; }
    .cell.friendly::before { border-color:var(--blue); } .cell.enemy::before { border-color:var(--red); }
    .cell.selected { box-shadow:inset 0 0 0 4px var(--gold); z-index:2; }
    .cell.reachable { box-shadow:inset 0 0 0 3px rgba(153,225,255,.9); } .cell.target { box-shadow:inset 0 0 0 3px #ff8f71; }
    .cell.dead::after { content:"×"; color:#152033; font-size:2.7rem; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 14px; padding-top:16px; color:var(--muted); font-size:.7rem; }
    .dot { display:inline-block; width:10px; height:10px; margin-right:5px; border:2px solid; vertical-align:-1px; } .dot.blue{border-color:var(--blue)} .dot.red{border-color:var(--red)} .dot.green{background:#54895b;border-color:#54895b}.dot.dark{background:#2f6546;border-color:#2f6546}
    .sidebar { padding:18px; display:flex; flex-direction:column; gap:16px; }
    .panel-title { color:var(--gold); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; border-bottom:1px solid var(--rim); padding-bottom:9px; }
    #unit-card { min-height:140px; } .unit-name { margin:7px 0 4px; font-size:1.15rem; } .unit-meta { color:var(--muted); font-size:.76rem; }
    .bar { height:10px; background:#101722; margin:11px 0 5px; border:1px solid #476276; } .bar span { display:block; height:100%; background:linear-gradient(90deg,#c9434f,#ec7571); }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; font-size:.75rem; } .stat { background:#172235; padding:7px; } .stat b { color:var(--gold); float:right; }
    #log { min-height:128px; color:var(--muted); font-size:.75rem; line-height:1.55; overflow:auto; } #log p { margin:0 0 8px; } #log p:first-child { color:var(--ink); }
    .controls { margin-top:auto; display:grid; gap:8px; } .controls button { padding:11px 10px; border:2px solid var(--gold); background:#293b55; font-weight:bold; } .controls button:hover,.controls button:focus-visible { background:#3c5575; outline:none; } .controls button.secondary { border-color:var(--rim); color:var(--muted); }
    .help { color:var(--muted); font-size:.7rem; line-height:1.55; }
    #modal { position:fixed; inset:0; display:none; place-items:center; padding:20px; background:rgba(7,12,20,.74); } #modal.show { display:grid; } .modal-box { width:min(420px,100%); background:var(--panel); border:3px solid var(--gold); padding:28px; text-align:center; box-shadow:10px 10px 0 rgba(0,0,0,.25); } .modal-box h2{margin:0;color:var(--gold)} .modal-box p{color:var(--muted);line-height:1.6}
    @media (max-width:780px) { .shell{padding:14px} header{align-items:start; flex-direction:column}.chapter{text-align:left} main{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.controls{grid-column:1/-1}.help{display:none} }
    @media (max-width:480px) { .sidebar{grid-template-columns:1fr}.cell.friendly::before,.cell.enemy::before{border-width:2px}.game{padding:10px}.sidebar{padding:14px} }
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="eyebrow">Original browser tactical RPG</div><h1>ASHEN BANNER</h1></div><div class="chapter">CHAPTER 01 — THE RIVER ROAD<br><span id="round">ROUND 1</span></div></header>
    <main>
      <section class="game" aria-label="Battlefield">
        <div class="topline"><span id="objective">OBJECTIVE: Defeat the raiders</span><span id="turn">PLAYER PHASE</span></div>
        <div id="board" aria-label="8 by 8 tactical map"></div>
        <div class="legend"><span><i class="dot blue"></i>Vanguard</span><span><i class="dot red"></i>Raider</span><span><i class="dot green"></i>Plain</span><span><i class="dot dark"></i>Forest +1 DEF</span></div>
      </section>
      <aside class="sidebar">
        <section><div class="panel-title">Unit dossier</div><div id="unit-card"></div></section>
        <section><div class="panel-title">Battle log</div><div id="log" aria-live="polite"></div></section>
        <div class="controls"><button id="end-turn">End turn</button><button id="restart" class="secondary">Restart battle</button></div>
        <div class="help">Select a blue unit. Move to a highlighted tile, then choose an adjacent red unit to attack. Forest grants +1 defense.</div>
      </aside>
    </main>
  </div>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="result-title"><div class="modal-box"><h2 id="result-title"></h2><p id="result-text"></p><button id="again">Play again</button></div></div>
  <script>
    const terrain = [
      'p p f p r r p p','p f f p r p p p','p p p p r p f p','w w p f p p f p','p r p f p p p p','p r p p f p f p','p p p p p p f p','p p p p p p p p'
    ].map(r=>r.split(' '));
    const terrainName={p:'Plain',f:'Forest',r:'Road',w:'Water'};
    const baseUnits = [
      {id:'a',team:'player',name:'Arlen',role:'Banner Guard',symbol:'A',x:1,y:6,hp:22,max:22,atk:8,def:4,move:3},
      {id:'b',team:'player',name:'Bryn',role:'River Scout',symbol:'B',x:2,y:5,hp:17,max:17,atk:6,def:2,move:4},
      {id:'c',team:'player',name:'Cira',role:'Wind Adept',symbol:'C',x:0,y:7,hp:14,max:14,atk:9,def:1,move:3},
      {id:'d',team:'enemy',name:'Hark',role:'Raider Captain',symbol:'H',x:6,y:1,hp:24,max:24,atk:8,def:3,move:3},
      {id:'e',team:'enemy',name:'Moro',role:'Axe Raider',symbol:'M',x:6,y:4,hp:18,max:18,atk:7,def:2,move:3},
      {id:'f',team:'enemy',name:'Siv',role:'Axe Raider',symbol:'S',x:7,y:6,hp:18,max:18,atk:7,def:2,move:3}
    ];
    let units, selected, phase, round, logs, locked;
    const board=document.querySelector('#board'), unitCard=document.querySelector('#unit-card'), logEl=document.querySelector('#log'), turnEl=document.querySelector('#turn'), roundEl=document.querySelector('#round'), modal=document.querySelector('#modal');
    const alive=()=>units.filter(u=>u.hp>0); const at=(x,y)=>alive().find(u=>u.x===x&&u.y===y); const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
    function reset(){ units=baseUnits.map(u=>({...u,moved:false})); selected=null; phase='player'; round=1; logs=['The vanguard reaches the River Road.']; locked=false; modal.classList.remove('show'); render(); }
    function tileCost(x,y){return terrain[y][x]==='w'||at(x,y)?99:(terrain[y][x]==='f'?2:1)}
    function reachable(u){ const seen=new Map([[`${u.x},${u.y}`,0]]), q=[[u.x,u.y,0]]; while(q.length){const [x,y,c]=q.shift(); [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>7||ny>7)return;const n=c+tileCost(nx,ny),k=`${nx},${ny}`;if(n<=u.move&&(!seen.has(k)||n<seen.get(k))){seen.set(k,n);q.push([nx,ny,n])}})} return seen; }
    function defense(u){return u.def+(terrain[u.y][u.x]==='f'?1:0)}
    function log(s){logs.unshift(s);logs=logs.slice(0,5)}
    function render(){ board.innerHTML=''; const moves=selected&&phase==='player'&&!selected.moved?reachable(selected):new Map();
      for(let y=0;y<8;y++)for(let x=0;x<8;x++){ const u=at(x,y), b=document.createElement('button'), key=`${x},${y}`; b.className=`cell ${terrainName[terrain[y][x]].toLowerCase()} ${u?u.team==='player'?'friendly':'enemy':''}`; b.dataset.symbol=u?u.symbol:''; b.setAttribute('aria-label',u?`${u.name}, ${u.team}, ${u.hp} health, on ${terrainName[terrain[y][x]]}`:`${terrainName[terrain[y][x]]}, row ${y+1} column ${x+1}`); if(selected?.x===x&&selected?.y===y)b.classList.add('selected'); if(!u&&moves.has(key)&&key!==`${selected.x},${selected.y}`)b.classList.add('reachable'); if(u&&selected&&u.team!==selected.team&&distance(selected,u)===1)b.classList.add('target'); b.onclick=()=>clickTile(x,y); board.appendChild(b); }
      turnEl.textContent=phase==='player'?'PLAYER PHASE':'RAIDER PHASE'; roundEl.textContent=`ROUND ${round}`; renderCard(); logEl.innerHTML=logs.map(x=>`<p>${x}</p>`).join(''); document.querySelector('#end-turn').disabled=phase!=='player'||locked; }
    function renderCard(){let u=selected||alive().find(u=>u.team==='player');if(!u){unitCard.innerHTML='';return} const bonus=terrain[u.y][u.x]==='f'?' +1 forest':'';unitCard.innerHTML=`<div class="unit-name">${u.symbol} ${u.name}</div><div class="unit-meta">${u.role} · ${u.team==='player'?'Vanguard':'Raider'}</div><div class="bar"><span style="width:${u.hp/u.max*100}%"></span></div><div class="unit-meta">HP ${u.hp}/${u.max}</div><div class="stats"><div class="stat">ATK <b>${u.atk}</b></div><div class="stat">DEF <b>${defense(u)}</b></div><div class="stat">MOV <b>${u.move}</b></div><div class="stat">TILE <b>${terrainName[terrain[u.y][u.x]]}${bonus}</b></div></div>`}
    function clickTile(x,y){if(locked||phase!=='player')return;const u=at(x,y);if(u?.team==='player'&&!u.moved){selected=u;render();return}if(!selected)return;if(u?.team==='enemy'&&distance(selected,u)===1){attack(selected,u);return}const valid=reachable(selected);if(!u&&valid.has(`${x},${y}`)&&`${x},${y}`!==`${selected.x},${selected.y}`){selected.x=x;selected.y=y;log(`${selected.name} advances across the ${terrainName[terrain[y][x]].toLowerCase()}.`);render();}}
    function attack(a,b){const damage=Math.max(1,a.atk-defense(b));b.hp-=damage;log(`${a.name} strikes ${b.name} for ${damage}.`);if(b.hp<=0){log(`${b.name} falls.`)}else if(distance(a,b)===1){const counter=Math.max(1,b.atk-defense(a));a.hp-=counter;log(`${b.name} counters for ${counter}.`);if(a.hp<=0)log(`${a.name} falls.`)}a.moved=true;selected=null;checkEnd();render();}
    function checkEnd(){const p=alive().filter(u=>u.team==='player'),e=alive().filter(u=>u.team==='enemy');if(!e.length)finish(true);if(!p.length)finish(false)}
    function finish(win){locked=true;document.querySelector('#result-title').textContent=win?'VICTORY':'DEFEAT';document.querySelector('#result-text').textContent=win?'The raiders scatter. The River Road remains open—for tonight.':'The banner falls. Rally the vanguard and try again.';modal.classList.add('show')}
    async function enemyTurn(){phase='enemy';selected=null;render();await pause(450);for(const e of alive().filter(u=>u.team==='enemy')){const friends=alive().filter(u=>u.team==='player');if(!friends.length)break;let target=friends.sort((a,b)=>distance(e,a)-distance(e,b))[0];if(distance(e,target)>1){const choices=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(c=>c.x>=0&&c.y>=0&&c.x<8&&c.y<8&&!at(c.x,c.y)&&terrain[c.y][c.x]!=='w');choices.sort((a,b)=>(Math.abs(a.x-target.x)+Math.abs(a.y-target.y))-(Math.abs(b.x-target.x)+Math.abs(b.y-target.y)));let steps=e.move;while(steps--&&choices.length&&distance(e,target)>1){const c=choices.shift();e.x=c.x;e.y=c.y;break}}if(distance(e,target)===1&&target.hp>0){const dmg=Math.max(1,e.atk-defense(target));target.hp-=dmg;log(`${e.name} attacks ${target.name} for ${dmg}.`);if(target.hp<=0)log(`${target.name} falls.`)}render();checkEnd();if(locked)return;await pause(300)}phase='player';round++;alive().filter(u=>u.team==='player').forEach(u=>u.moved=false);log('The vanguard takes the initiative.');render();}
    const pause=ms=>new Promise(r=>setTimeout(r,ms)); document.querySelector('#end-turn').onclick=()=>{if(phase==='player'&&!locked)enemyTurn()};document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;reset();
  </script>
</body>
</html>
